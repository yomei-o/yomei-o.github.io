<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>MAME & Multi Web Player</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
    }
    
    /* 画面上部に浮かぶメニューバー */
    #menu-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(42, 42, 42, 0.95);
      padding: 10px 20px;
      box-sizing: border-box;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      z-index: 99999; /* エミュレータの画面より必ず前に出す */
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    label {
      font-size: 12px;
      color: #aaa;
      font-weight: bold;
    }

    select, input[type="file"], button {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    button {
      background-color: #007acc;
      border: none;
      font-weight: bold;
    }

    button:hover {
      background-color: #0098ff;
    }

    /* エミュレータの画面に対してドット絵をクッキリさせる */
    canvas {
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
    }
  </style>

  <script src="nostalgist.js" defer></script>
  <script src="nostalgist.umd.js"></script>
</head>
<body>

  <div id="menu-bar">
    <div class="form-group">
      <label for="core-select">1. コア</label>
      <select id="core-select">
        <option value="mame2003_plus" selected>MAME 2003 Plus (mame2003_plus)</option>
        <option value="mednafen_pce_fast">PCエンジン (mednafen_pce_fast)</option>
        <option value="snes9x">スーパーファミコン (snes9x)</option>
        <option value="fceumm">ファミコン (fceumm)</option>
        <option value="mgba">ゲームボーイアドバンス (mgba)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="rom-file">2. ROMファイル</label>
      <input type="file" id="rom-file">
    </div>

    <button id="launch-btn">起動する</button>
  </div>

  <script>
    const menuBar = document.getElementById('menu-bar');
    const coreSelect = document.getElementById('core-select');
    const romFileInput = document.getElementById('rom-file');
    const launchBtn = document.getElementById('launch-btn');

    let currentSession = null;

    launchBtn.addEventListener('click', async () => {
      const file = romFileInput.files[0];
      const selectedCore = coreSelect.value;

      if (!file) {
        alert('ROMファイルを選択してください。');
        return;
      }

      if (currentSession) {
        try {
          currentSession.exit();
        } catch (e) {
          console.log('クリーンアップ', e);
        }
      }

      try {
        launchBtn.textContent = '起動中...';
        launchBtn.disabled = true;

        // エミュレータを画面いっぱい（element指定なし）で起動
        currentSession = await Nostalgist.launch({
          core: selectedCore,
          rom: file
        });

        // 【ここを修正】起動に成功したら、メニューバーをHTML構造から完全に消す（非表示にする）
        menuBar.style.display = 'none';
        
        console.log(`${selectedCore} が正常に起動しました。メニューを非表示にしました。`);

      } catch (error) {
        console.error('起動エラー:', error);
        alert('エラーが発生しました。コアに対応した正しいROM形式か確認してください。');
        launchBtn.textContent = '起動する';
        launchBtn.disabled = false;
        // エラーの時はメニューを残す
        menuBar.style.display = 'flex'; 
      }
    });
  </script>

</body>
</html>
