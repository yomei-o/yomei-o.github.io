<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪結晶シミュレーション — 小林モデル (フェーズフィールド法)</title>
<style>
  :root { --bg:#0a0e16; --panel:#141b28; --line:#243047; --txt:#cdd6e4; --accent:#6ab7ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 12px; color: #7e8aa0; margin-bottom: 14px; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  canvas {
    background: #000; border-radius: 8px; image-rendering: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); width: 520px; height: 520px; max-width: 90vw;
  }
  #status { font-variant-numeric: tabular-nums; font-size: 13px; color: #9fb0c8; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; width: 320px; max-width: 90vw;
  }
  .row { margin: 10px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; color: #aab6cb; }
  .row label b { color: var(--txt); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin-top: 4px; }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; padding: 9px; border: 1px solid var(--line); border-radius: 7px;
    background: #1c2638; color: var(--txt); cursor: pointer; font-size: 13px;
  }
  button:hover { background: #243349; }
  button.primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  .hint { font-size: 11px; color: #6c7890; margin-top: 12px; line-height: 1.5; }
  select { width: 100%; padding: 6px; background:#1c2638; color:var(--txt); border:1px solid var(--line); border-radius:6px; margin-top:4px; }
</style>
</head>
<body>

<div id="stage">
  <div style="text-align:center">
    <h1>❄ 雪結晶シミュレーション</h1>
    <div class="sub">Kobayashi (1993) フェーズフィールド法 / phase-field dendritic growth</div>
  </div>
  <canvas id="cv" width="300" height="300"></canvas>
  <div id="status">準備完了</div>
</div>

<div class="panel">
  <div class="row">
    <label>対称性 J <b id="vJ">6</b></label>
    <select id="J">
      <option value="6" selected>6 — 雪 (六方晶)</option>
      <option value="4">4 — 正方デンドライト</option>
      <option value="3">3</option>
      <option value="5">5</option>
      <option value="8">8</option>
    </select>
  </div>
  <div class="row">
    <label>α 駆動力(過冷却) <b id="vA">0.90</b></label>
    <input type="range" id="alpha" min="0.5" max="1.0" step="0.01" value="0.90">
  </div>
  <div class="row">
    <label>δ 異方性強度 <b id="vD">0.040</b></label>
    <input type="range" id="delta" min="0.01" max="0.08" step="0.005" value="0.04">
  </div>
  <div class="row">
    <label>K 潜熱係数 <b id="vK">1.80</b></label>
    <input type="range" id="K" min="1.0" max="2.4" step="0.05" value="1.80">
  </div>
  <div class="row">
    <label>ε̄ 界面エネルギー(枝の太さ) <b id="vE">0.010</b></label>
    <input type="range" id="ebar" min="0.006" max="0.016" step="0.001" value="0.010">
  </div>
  <div class="row">
    <label>θ₀ 異方性基準角 [rad] <b id="vT">0.20</b></label>
    <input type="range" id="theta0" min="0" max="1.04" step="0.02" value="0.20">
  </div>
  <div class="row">
    <label>格子サイズ N <b id="vN">300</b></label>
    <select id="N">
      <option value="200">200 (速い)</option>
      <option value="300" selected>300 (標準)</option>
      <option value="400">400 (細かい・重い)</option>
    </select>
  </div>
  <div class="row">
    <label>1フレームあたりのステップ数 <b id="vS">15</b></label>
    <input type="range" id="spf" min="1" max="40" step="1" value="15">
  </div>

  <div class="btns">
    <button class="primary" id="run">▶ 開始</button>
    <button id="reset">⟲ リセット</button>
  </div>

  <div class="hint">
    中央の氷の核から、過冷却と六方晶の異方性で6本腕の樹枝が自発的に成長します。
    パラメータは即時反映(δ/K/α/θ₀/ε̄)。N と J を変えると自動でリセットします。<br>
    ヒント: α↑で側枝が増えて細かく、K↑で枝が細く分離、ε̄↓で幹が細く繊細に。
  </div>
</div>

<script>
"use strict";
// ============================================================================
//  小林モデル (Kobayashi 1993) フェーズフィールド法 — JS 移植
//    位相場 phi (0=液相, 1=固相/氷) と 無次元温度 T を連立で解く。
//    周期境界・単純中心差分・5点ラプラシアン。phi はクリップしない。
// ============================================================================

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const statusEl = document.getElementById("status");

// --- パラメータ (Python _ok 版 / N=300 向け 既定値) ---
const P = {
  N: 300, dx: 0.03, dt: 1.0e-4,
  tau: 3.0e-4, ebar: 0.010, delta: 0.04, J: 6, theta0: 0.20,
  alpha: 0.90, gamma: 10.0, T_eq: 1.0,
  K: 1.80, T_init: 0.0,
  seed_r: 5.0,
};

let N, phi, T, phiN, TN, a, ax, ay, img, step, running = false, raf = 0;

// matplotlib "bone" カラーマップ (区分線形)
function bone(x) {
  if (x < 0) x = 0; if (x > 1) x = 1;
  let r, g, b;
  if (x <= 0.746032) r = 0.652778 / 0.746032 * x;
  else               r = 0.652778 + (1 - 0.652778) / (1 - 0.746032) * (x - 0.746032);
  if (x <= 0.365079)      g = 0.319444 / 0.365079 * x;
  else if (x <= 0.746032) g = 0.319444 + (0.777778 - 0.319444) / (0.746032 - 0.365079) * (x - 0.365079);
  else                    g = 0.777778 + (1 - 0.777778) / (1 - 0.746032) * (x - 0.746032);
  if (x <= 0.365079) b = 0.444444 / 0.365079 * x;
  else               b = 0.444444 + (1 - 0.444444) / (1 - 0.365079) * (x - 0.365079);
  return [r * 255 | 0, g * 255 | 0, b * 255 | 0];
}

function init() {
  N = P.N;
  cv.width = N; cv.height = N;
  const n2 = N * N;
  phi = new Float64Array(n2);
  T   = new Float64Array(n2).fill(P.T_init);
  phiN = new Float64Array(n2);
  TN   = new Float64Array(n2);
  a  = new Float64Array(n2);
  ax = new Float64Array(n2);
  ay = new Float64Array(n2);
  img = ctx.createImageData(N, N);
  step = 0;

  // 中央に小さな氷の核
  const c = N >> 1;
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++) {
      const r = Math.hypot(j - c, i - c);
      if (r < P.seed_r) phi[i * N + j] = 1.0;
    }
  render();
}

// 1ステップ更新
function update() {
  const dx = P.dx, dt = P.dt, tau = P.tau, ebar = P.ebar, delta = P.delta,
        J = P.J, theta0 = P.theta0, alpha = P.alpha, gamma = P.gamma,
        T_eq = P.T_eq, K = P.K;
  const inv2dx = 1.0 / (2.0 * dx);
  const invdx2 = 1.0 / (dx * dx);

  // 1パス目: 勾配と異方性 a = eps*eps', a*phi_x, a*phi_y
  for (let i = 0; i < N; i++) {
    const im = (i === 0 ? N - 1 : i - 1) * N;
    const ip = (i === N - 1 ? 0 : i + 1) * N;
    const i0 = i * N;
    for (let j = 0; j < N; j++) {
      const jm = j === 0 ? N - 1 : j - 1;
      const jp = j === N - 1 ? 0 : j + 1;
      const phi_x = (phi[i0 + jp] - phi[i0 + jm]) * inv2dx;
      const phi_y = (phi[ip + j]  - phi[im + j])  * inv2dx;
      const theta = Math.atan2(phi_y, phi_x);
      const ang = J * (theta - theta0);
      const eps   = ebar * (1.0 + delta * Math.cos(ang));
      const eps_d = -ebar * J * delta * Math.sin(ang);
      const av = eps * eps_d;
      const idx = i0 + j;
      a[idx]  = av;
      ax[idx] = av * phi_x;
      ay[idx] = av * phi_y;
    }
  }

  // 2パス目: 交差項 + eps^2*lap(phi) + 反応項, 温度更新
  for (let i = 0; i < N; i++) {
    const im = (i === 0 ? N - 1 : i - 1) * N;
    const ip = (i === N - 1 ? 0 : i + 1) * N;
    const i0 = i * N;
    for (let j = 0; j < N; j++) {
      const jm = j === 0 ? N - 1 : j - 1;
      const jp = j === N - 1 ? 0 : j + 1;
      const idx = i0 + j;

      // cross = d/dy(a*phi_x) - d/dx(a*phi_y)
      const cross = (ax[ip + j] - ax[im + j]) * inv2dx
                  - (ay[i0 + jp] - ay[i0 + jm]) * inv2dx;

      // この点の eps (eps^2*lap 用)
      const phi_x = (phi[i0 + jp] - phi[i0 + jm]) * inv2dx;
      const phi_y = (phi[ip + j]  - phi[im + j])  * inv2dx;
      const theta = Math.atan2(phi_y, phi_x);
      const eps = ebar * (1.0 + delta * Math.cos(J * (theta - theta0)));

      const pij = phi[idx];
      const lap_phi = (phi[ip + j] + phi[im + j] + phi[i0 + jp] + phi[i0 + jm] - 4.0 * pij) * invdx2;

      const Tij = T[idx];
      const m = (alpha / Math.PI) * Math.atan(gamma * (T_eq - Tij));
      const react = pij * (1.0 - pij) * (pij - 0.5 + m);
      const dphi = (cross + eps * eps * lap_phi + react) / tau;

      const lap_T = (T[ip + j] + T[im + j] + T[i0 + jp] + T[i0 + jm] - 4.0 * Tij) * invdx2;

      phiN[idx] = pij + dt * dphi;            // クリップしない
      TN[idx]   = Tij + dt * (lap_T + K * dphi);
    }
  }
  // swap
  let t;
  t = phi; phi = phiN; phiN = t;
  t = T;   T = TN;     TN = t;
  step++;
}

function render() {
  const d = img.data;
  for (let k = 0, p = 0; k < N * N; k++, p += 4) {
    let v = phi[k];
    if (v < 0) v = 0; else if (v > 1) v = 1;
    const c = bone(v);
    d[p] = c[0]; d[p + 1] = c[1]; d[p + 2] = c[2]; d[p + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function solidFraction() {
  let s = 0;
  for (let k = 0; k < N * N; k++) if (phi[k] > 0.5) s++;
  return s / (N * N);
}

let lastT = 0;
function frame(ts) {
  if (!running) return;
  const spf = +document.getElementById("spf").value;
  for (let s = 0; s < spf; s++) update();
  render();
  const frac = solidFraction();
  let fps = 0;
  if (lastT) fps = 1000 / (ts - lastT);
  lastT = ts;
  statusEl.textContent = `step ${step}   solid ${(frac * 100).toFixed(1)}%   ${fps.toFixed(0)} fps`;
  // 結晶が領域端に達したら自動停止
  if (frac > 0.45) { running = false; document.getElementById("run").textContent = "▶ 開始"; statusEl.textContent += "  (端に到達 → 停止)"; return; }
  raf = requestAnimationFrame(frame);
}

// --- UI 配線 ---
const ids = ["alpha","delta","K","ebar","theta0","spf"];
const view = { alpha:["vA",2], delta:["vD",3], K:["vK",2], ebar:["vE",3], theta0:["vT",2], spf:["vS",0] };
function syncLabels() {
  for (const id of ids) {
    const [vid, dec] = view[id];
    const val = +document.getElementById(id).value;
    document.getElementById(vid).textContent = id === "spf" ? val : val.toFixed(dec);
    if (id !== "spf") P[id] = val;   // 即時反映
  }
}
ids.forEach(id => document.getElementById(id).addEventListener("input", syncLabels));

document.getElementById("J").addEventListener("change", e => {
  P.J = +e.target.value;
  document.getElementById("vJ").textContent = P.J;
  doReset();
});
document.getElementById("N").addEventListener("change", e => {
  P.N = +e.target.value;
  document.getElementById("vN").textContent = P.N;
  doReset();
});

function doReset() {
  running = false;
  cancelAnimationFrame(raf);
  document.getElementById("run").textContent = "▶ 開始";
  lastT = 0;
  init();
  statusEl.textContent = "準備完了";
}

document.getElementById("run").addEventListener("click", e => {
  running = !running;
  e.target.textContent = running ? "⏸ 一時停止" : "▶ 開始";
  if (running) { lastT = 0; raf = requestAnimationFrame(frame); }
});
document.getElementById("reset").addEventListener("click", doReset);

syncLabels();
init();
</script>
</body>
</html>
