<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪結晶シミュレーション — 小林モデル (C++/WASM)</title>
<style>
  :root { --bg:#0a0e16; --panel:#141b28; --line:#243047; --txt:#cdd6e4; --accent:#6ab7ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 12px; color: #7e8aa0; margin-bottom: 14px; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  canvas {
    background: #000; border-radius: 8px; image-rendering: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); width: 520px; height: 520px; max-width: 90vw;
  }
  #status { font-variant-numeric: tabular-nums; font-size: 13px; color: #9fb0c8; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; width: 320px; max-width: 90vw;
  }
  .row { margin: 10px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; color: #aab6cb; }
  .row label b { color: var(--txt); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin-top: 4px; }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; padding: 9px; border: 1px solid var(--line); border-radius: 7px;
    background: #1c2638; color: var(--txt); cursor: pointer; font-size: 13px;
  }
  button:hover { background: #243349; }
  button.primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  .hint { font-size: 11px; color: #6c7890; margin-top: 12px; line-height: 1.5; }
  select { width: 100%; padding: 6px; background:#1c2638; color:var(--txt); border:1px solid var(--line); border-radius:6px; margin-top:4px; }
  a { color: var(--accent); }
</style>
</head>
<body>

<div id="stage">
  <div style="text-align:center">
    <h1>❄ 雪結晶シミュレーション <span style="font-size:12px;color:#7e8aa0">(C++ / WASM)</span></h1>
    <div class="sub">Kobayashi (1993) フェーズフィールド法 / phase-field dendritic growth</div>
  </div>
  <canvas id="cv" width="300" height="300"></canvas>
  <div id="status">読み込み中…</div>
</div>

<div class="panel">
  <div class="row">
    <label>対称性 J <b id="vJ">6</b></label>
    <select id="J">
      <option value="6" selected>6 — 雪 (六方晶)</option>
      <option value="4">4 — 正方デンドライト</option>
      <option value="3">3</option>
      <option value="5">5</option>
      <option value="8">8</option>
    </select>
  </div>
  <div class="row">
    <label>α 駆動力(過冷却) <b id="vA">0.90</b></label>
    <input type="range" id="alpha" min="0.5" max="1.0" step="0.01" value="0.90">
  </div>
  <div class="row">
    <label>δ 異方性強度 <b id="vD">0.040</b></label>
    <input type="range" id="delta" min="0.01" max="0.08" step="0.005" value="0.04">
  </div>
  <div class="row">
    <label>K 潜熱係数 <b id="vK">1.80</b></label>
    <input type="range" id="K" min="1.0" max="2.4" step="0.05" value="1.80">
  </div>
  <div class="row">
    <label>ε̄ 界面エネルギー(枝の太さ) <b id="vE">0.010</b></label>
    <input type="range" id="ebar" min="0.006" max="0.016" step="0.001" value="0.010">
  </div>
  <div class="row">
    <label>θ₀ 異方性基準角 [rad] <b id="vT">0.20</b></label>
    <input type="range" id="theta0" min="0" max="1.04" step="0.02" value="0.20">
  </div>
  <div class="row">
    <label>格子サイズ N <b id="vN">300</b></label>
    <select id="N">
      <option value="200">200 (速い)</option>
      <option value="300" selected>300 (標準)</option>
      <option value="400">400 (細かい)</option>
      <option value="520">520 (最も細かい・重い)</option>
    </select>
  </div>
  <div class="row">
    <label>1フレームあたりのステップ数 <b id="vS">15</b></label>
    <input type="range" id="spf" min="1" max="60" step="1" value="15">
  </div>

  <div class="btns">
    <button class="primary" id="run" disabled>▶ 開始</button>
    <button id="reset" disabled>⟲ リセット</button>
  </div>

  <div class="hint">
    中央の氷の核から、過冷却と六方晶の異方性で6本腕の樹枝が自発的に成長します。
    <b>計算コアは C++ → WASM</b>、JS は UI と canvas 転送のみ。
    パラメータは即時反映(δ/K/α/θ₀/ε̄)。N と J を変えると自動でリセットします。<br>
    ヒント: α↑で側枝が増えて細かく、K↑で枝が細く分離、ε̄↓で幹が細く繊細に。<br>
    ソース: <a href="https://github.com/yomei-o">github.com/yomei-o</a>
  </div>
</div>

<script src="snow.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d"), statusEl=$("status"), btnRun=$("run"), btnReset=$("reset");

let M=null, api={}, N=300, img=null, running=false, raf=0, lastT=0;

// live-adjustable params + display formatting
const ids=["alpha","delta","K","ebar","theta0","spf"];
const view={ alpha:["vA",2], delta:["vD",3], K:["vK",2], ebar:["vE",3], theta0:["vT",2], spf:["vS",0] };

createSnow().then(mod=>{
  M=mod;
  api.init   =M.cwrap("snow_init","number",["number"]);
  api.n      =M.cwrap("snow_n","number",[]);
  api.steps  =M.cwrap("snow_steps","number",[]);
  api.setJ   =M.cwrap("snow_set_J",null,["number"]);
  api.setA   =M.cwrap("snow_set_alpha",null,["number"]);
  api.setD   =M.cwrap("snow_set_delta",null,["number"]);
  api.setK   =M.cwrap("snow_set_K",null,["number"]);
  api.setE   =M.cwrap("snow_set_ebar",null,["number"]);
  api.setT0  =M.cwrap("snow_set_theta0",null,["number"]);
  api.step   =M.cwrap("snow_step",null,["number"]);
  api.render =M.cwrap("snow_render","number",[]);
  api.solid  =M.cwrap("snow_solid","number",[]);
  btnRun.disabled=false; btnReset.disabled=false;
  pushParams();
  init();
  statusEl.textContent="準備完了 — ▶ 開始";
});

function pushParams(){                       // send all live params to the core
  api.setJ(+$("J").value);
  api.setA(+$("alpha").value);
  api.setD(+$("delta").value);
  api.setK(+$("K").value);
  api.setE(+$("ebar").value);
  api.setT0(+$("theta0").value);
}

function init(){
  N=+$("N").value;
  N=api.init(N);
  cv.width=N; cv.height=N; img=ctx.createImageData(N,N);
  render();
}

function render(){
  const p=api.render();
  img.data.set(M.HEAPU8.subarray(p, p+N*N*4));
  ctx.putImageData(img,0,0);
}

function frame(ts){
  if(!running) return;
  const spf=+$("spf").value;
  api.step(spf);
  render();
  const frac=api.solid();
  let fps=0; if(lastT) fps=1000/(ts-lastT); lastT=ts;
  statusEl.textContent=`step ${api.steps()}   solid ${(frac*100).toFixed(1)}%   ${fps.toFixed(0)} fps`;
  if(frac>0.45){ running=false; btnRun.textContent="▶ 開始"; statusEl.textContent+="  (端に到達 → 停止)"; return; }
  raf=requestAnimationFrame(frame);
}

function syncLabels(){
  for(const id of ids){ const [vid,dec]=view[id]; const val=+$(id).value;
    $(vid).textContent = id==="spf" ? val : val.toFixed(dec); }
}
function doReset(){
  running=false; cancelAnimationFrame(raf); btnRun.textContent="▶ 開始"; lastT=0;
  if(M){ pushParams(); init(); statusEl.textContent="準備完了 — ▶ 開始"; }
}

// live sliders -> update label + push to core immediately
$("alpha").addEventListener("input", e=>{ syncLabels(); if(M) api.setA(+e.target.value); });
$("delta").addEventListener("input", e=>{ syncLabels(); if(M) api.setD(+e.target.value); });
$("K").addEventListener("input",     e=>{ syncLabels(); if(M) api.setK(+e.target.value); });
$("ebar").addEventListener("input",  e=>{ syncLabels(); if(M) api.setE(+e.target.value); });
$("theta0").addEventListener("input",e=>{ syncLabels(); if(M) api.setT0(+e.target.value); });
$("spf").addEventListener("input",   syncLabels);

$("J").addEventListener("change", e=>{ $("vJ").textContent=e.target.value; doReset(); });
$("N").addEventListener("change", e=>{ $("vN").textContent=e.target.value; doReset(); });

btnRun.addEventListener("click", e=>{
  if(!M) return;
  running=!running; e.target.textContent = running ? "⏸ 一時停止" : "▶ 開始";
  if(running){ lastT=0; raf=requestAnimationFrame(frame); }
});
btnReset.addEventListener("click", doReset);

syncLabels();
</script>
</body>
</html>
