<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Super Mario - Web Emulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="reset.css" rel="stylesheet">
  <style>
    /* https://css-tricks.com/box-sizing/ */
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    
    body {
      margin: 0;
      background-color: #7b1022; /* ファミコン風のえんじ色 */
      color: #fff;
      font-family: sans-serif;
      overflow: hidden; /* スクロール禁止 */
      touch-action: none; /* デフォルトのタッチアクションを無効化 */
    }

    .main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* ゲーム画面エリア */
    .screen-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      padding: 10px;
      box-shadow: inset 0 -4px 10px rgba(0,0,0,0.8);
    }

    canvas {
      width: 100%;
      max-width: 480px;
      height: auto;
      aspect-ratio: 256 / 240;
      box-sizing: content-box;
      border: 4px solid #d4af37; /* ゴールドフレーム */
      border-radius: 8px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
    }

    /* バーチャルコントローラーエリア */
    .controls {
      height: 220px;
      background-color: #e0d0a0; /* コントローラー風のゴールド/ベージュ */
      display: flex;
      position: relative;
      padding: 10px;
      border-top: 4px solid #000;
    }

    /* 十字キー */
    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
      margin-top: 30px;
      margin-left: 20px;
    }
    .dpad-btn {
      position: absolute;
      background-color: #333;
      border: 2px solid #111;
      border-radius: 4px;
      width: 36px;
      height: 36px;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0
