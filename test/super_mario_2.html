<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Super Mario - Web Emulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="reset.css" rel="stylesheet">
  <style>
    /* ========== 元のCSS（一部上書き） ========== */
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    
    .sidebar, .overlap, .bar-wrap, #downloadEl {
      display: none !important;
    }
    
    .main {
      display: flex !important;
      position: relative !important;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      background-color: transparent;
    }

    canvas {
      width: 100% !important;
      max-width: 480px !important;
      height: auto !important;
      aspect-ratio: 256 / 240;
      box-sizing: content-box;
      border: 4px solid #d4af37;
      border-radius: 8px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
    }

    /* ========== スマホ用UIのCSS ========== */
    body {
      margin: 0;
      background-color: #7b1022;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none; /* テキスト選択を防止 */
      -webkit-user-select: none;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .screen-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      padding: 10px;
      box-shadow: inset 0 -4px 10px rgba(0,0,0,0.8);
      position: relative;
    }

    /* バーチャルコントローラー */
    .controls {
      height: 220px;
      background-color: #e0d0a0;
      display: flex;
      position: relative;
      padding: 10px;
      border-top: 4px solid #000;
    }

    /* 十字キー */
    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
      margin-top: 30px;
      margin-left: 20px;
    }
    .dpad-btn {
      position: absolute;
      background-color: #333;
      border: 2px solid #111;
      border-radius: 4px;
      width: 36px;
      height: 36px;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .dpad-btn:active, .dpad-btn.active { background-color: #777; }
    .dpad-up { top: 0; left: 42px; height: 46px; border-bottom: none; border-radius: 4px 4px 0 0; }
    .dpad-down { bottom: 0; left: 42px; height: 46px; border-top: none; border-radius: 0 0 4px 4px; }
    .dpad-left { top: 42px; left: 0; width: 46px; border-right: none; border-radius: 4px 0 0 4px; }
    .dpad-right { top: 42px; right: 0; width: 46px; border-left: none; border-radius: 0 4px 4px 0; }
    .dpad-center {
      position: absolute;
      top: 42px; left: 42px;
      width: 36px; height: 36px;
      background-color: #333;
      border: none;
    }

    /* START / SELECT ボタン */
    .center-btns {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }
    .pill-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pill-btn {
      width: 45px;
      height: 16px;
      background-color: #333;
      border-radius: 8px;
      border: 2px solid #111;
      box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
      transform: rotate(-20deg);
      cursor: pointer;
    }
    .pill-btn:active, .pill-btn.active { background-color: #777; }
    .pill-label { font-size: 10px; color: #7b1022; font-weight: bold; margin-top: 10px; }

    /* A / B ボタン */
    .action-btns {
      position: absolute;
      right: 20px;
      top: 60px;
      display: flex;
      gap: 20px;
    }
    .round-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    .round-btn-wrap:last-child { margin-top: 0; }
    .round-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #7b1022;
      border: 3px solid #333;
      box-shadow: inset -2px -2px 5px rgba(0,0,0,0.6), 2px 2px 4px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .round-btn:active, .round-btn.active { background-color: #d6304c; }
    .round-label { font-size: 14px; color: #7b1022; font-weight: bold; margin-top: 8px; }

    /* ロード画面 */
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #start-game-btn {
      padding: 15px 30px;
      font-size: 18px;
      background: #d4af37;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  
  <div id="loading-overlay">
    <h2 style="margin-bottom: 20px;">SUPER MARIO BROS.</h2>
    <button id="start-game-btn">GAME START</button>
  </div>

  <div id="app-container">
    <div class="screen-container">
      <div class="main">
        <canvas width="256" height="240" v-show="canvas.show" v-bind:style="{width:canvasWidthPx, height:canvasHeightPx}"></canvas>
        <div class="sidebar" hidden></div>
        <div class="input overlap" v-if="input.show"></div>
        <div class="setting overlap" v-if="input.setting"></div>
        <div class="files overlap" v-if="files.show">
          <input type="file" id="uploadRom" hidden @change="uploadRom">
        </div>
        <div class="bar-wrap top-line"></div>
        <a id="downloadEl" hidden download="game.sav"></a>
      </div>
    </div>
