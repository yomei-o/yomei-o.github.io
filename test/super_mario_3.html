<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Super Mario - Web Emulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="reset.css" rel="stylesheet">
  <style>
    /* ========== 元のCSSを内包・一部上書き ========== */
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    
    /* オリジナルの不要なUIを非表示にする */
    .sidebar, .overlap, .bar-wrap, #downloadEl {
      display: none !important;
    }
    
    /* 画面中央にキャンバスを綺麗に配置 */
    .main {
      display: flex !important;
      position: relative !important;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      background-color: transparent;
    }

    canvas {
      width: 100% !important;
      max-width: 480px !important;
      height: auto !important;
      aspect-ratio: 256 / 240;
      box-sizing: content-box;
      border: 4px solid #d4af37;
      border-radius: 8px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
    }

    /* ========== ゲームウォッチ・ファミコン風UIのCSS ========== */
    body {
      margin: 0;
      background-color: #7b1022; /* ファミコンのえんじ色 */
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .screen-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      padding: 10px;
      box-shadow: inset 0 -4px 10px rgba(0,0,0,0.8);
      position: relative;
    }

    /* バーチャルコントローラー */
    .controls {
      height: 220px;
      background-color: #e0d0a0; /* ベージュ・ゴールド */
      display: flex;
      position: relative;
      padding: 10px;
      border-top: 4px solid #000;
    }

    /* 十字キー */
    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
      margin-top: 30px;
      margin-left: 20px;
    }
    .dpad-btn {
      position: absolute;
      background-color: #333;
      border: 2px solid #111;
      border-radius: 4px;
      width: 36px;
      height: 36px;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .dpad-btn:active, .dpad-btn.active { background-color: #777; }
    .dpad-up { top: 0; left: 42px; height: 46px; border-bottom: none; border-radius: 4px 4px 0 0; }
    .dpad-down { bottom: 0; left: 42px; height: 46px; border-top: none; border-radius: 0 0 4px 4px; }
    .dpad-left { top: 42px; left: 0; width: 46px; border-right: none; border-radius: 4px 0 0 4px; }
    .dpad-right { top: 42px; right: 0; width: 46px; border-left: none; border-radius: 0 4px 4px 0; }
    .dpad-center {
      position: absolute;
      top: 42px; left: 42px;
      width: 36px; height: 36px;
      background-color: #333;
      border: none;
    }

    /* START / SELECT ボタン */
    .center-btns {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }
    .pill-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pill-btn {
      width: 45px;
      height: 16px;
      background-color: #333;
      border-radius: 8px;
      border: 2px solid #111;
      box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
      transform: rotate(-20deg);
      cursor: pointer;
    }
    .pill-btn:active, .pill-btn.active { background-color: #777; }
    .pill-label { font-size: 10px; color: #7b1022; font-weight: bold; margin-top: 10px; }

    /* A / B ボタン */
    .action-btns {
      position: absolute;
      right: 20px;
      top: 60px;
      display: flex;
      gap: 20px;
    }
    .round-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    .round-btn-wrap:last-child { margin-top: 0; }
    .round-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #7b1022;
      border: 3px solid #333;
      box-shadow: inset -2px -2px 5px rgba(0,0,0,0.6), 2px 2px 4px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .round-btn:active, .round-btn.active { background-color: #d6304c; }
    .round-label { font-size: 14px; color: #7b1022; font-weight: bold; margin-top: 8px; }

    /* タイトル兼ロード画面 */
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      text-align: center;
    }
    #start-game-btn {
      padding: 15px 30px;
      font-size: 18px;
      background: #d4af37;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    #start-game-btn:active {
      transform: scale(0.95);
    }
    #debug-log {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      max-width: 80%;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  
  <div id="loading-overlay">
    <h2 style="margin-bottom: 25px; letter-spacing: 2px;">SUPER MARIO BROS.</h2>
    <button id="start-game-btn">GAME START</button>
    <div id="debug-log">エミュレータ準備完了</div>
  </div>

  <div id="app-container">
    <div class="screen-container">
      <div class="main">
        <canvas width="256" height="240" v-show="canvas.show" v-bind:style="{width:canvasWidthPx, height:canvasHeightPx}"></canvas>
        <div class="sidebar" hidden></div>
        <div class="input overlap" v-if="input.show"></div>
        <div class="setting overlap" v-if="input.setting"></div>
        <div class="files overlap" v-if="files.show">
          <input type="file" id="uploadRom" hidden @change="uploadRom">
        </div>
        <div class="bar-wrap top-line"></div>
        <a id="downloadEl" hidden download="game.sav"></a>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <div class="dpad-center"></div>
        <div class="dpad-btn dpad-up" data-key="ArrowUp" data-keycode="38"></div>
        <div class="dpad-btn dpad-down" data-key="ArrowDown" data-keycode="40"></div>
        <div class="dpad-btn dpad-left" data-key="ArrowLeft" data-keycode="37"></div>
        <div class="dpad-btn dpad-right" data-key="ArrowRight" data-keycode="39"></div>
      </div>

      <div class="center-btns">
        <div class="pill-btn-wrap">
          <div class="pill-btn" data-key="ShiftLeft" data-keycode="16"></div>
          <div class="pill-label">SELECT</div>
        </div>
        <div class="pill-btn-wrap">
          <div class="pill-btn" data-key="Enter" data-keycode="13"></div>
          <div class="pill-label">START</div>
        </div>
      </div>

      <div class="action-btns">
        <div class="round-btn-wrap">
          <div class="round-btn" data-key="KeyZ" data-keycode="90"></div>
          <div class="round-label">B</div>
        </div>
        <div class="round-btn-wrap">
          <div class="round-btn" data-key="KeyX" data-keycode="88"></div>
          <div class="round-label">A</div>
        </div>
      </div>
    </div>
  </div>

  <script src="vue.min.js"></script>
  <script src="idb.min.js"></script>
  <script src="sha1.js"></script>
  <script src="demo.js"></script>

  <script>
    // ページとエミュレータ（demo.js）の読み込みが完全に終わってから実行
    window.addEventListener("load", () => {
      const romFileName = "super_mario.nes";
      const startBtn = document.getElementById('start-game-btn');
      const overlay = document.getElementById('loading-overlay');
      const logEl = document.getElementById('debug-log');

      function showStatus(msg) {
        console.log(msg);
        logEl.textContent = msg;
      }

      // Vue インスタンスを安全に取得
      function getVueApp() {
        const mainEl = document.querySelector('.main');
        return (mainEl && mainEl.__vue__) ? mainEl.__vue__ : null;
      }

      startBtn.addEventListener('click', async () => {
        const vueApp = getVueApp();
        if (!vueApp) {
          showStatus("エラー: エミュレータの初期化に失敗しています。再読み込みしてください。");
          return;
        }

        startBtn.textContent = "Loading...";

        // 【機能1】すでに一度読み込んで内部（IndexedDB）に保存されている場合は即座に起動
        const fileList = vueApp.files?.list || [];
        const existFile = fileList.find(f => f.name === romFileName);
        if (existFile) {
          showStatus("保存済みのROMを検出しました。起動します...");
          vueApp.playFile(existFile);
          overlay.style.display = 'none';
          return;
        }

        // 【機能2】自動取得（fetch）を試みる
        try {
          showStatus("サーバーからROMファイルを自動取得しています...");
          const response = await fetch(romFileName);
          if (!response.ok) throw new Error("Fetch Error");
          
          const blob = await response.blob();
          const file = new File([blob], romFileName, { type: 'application/octet-stream' });
          
          showStatus("ROMを解析中...");
          
          // タイマー待ちを廃止し、Vueのリアクティブデータ（files.list）に追加された瞬間をフックする
          const unwatch = vueApp.$watch('files.list', (newList) => {
            const target = newList.find(f => f.name === romFileName);
            if (target) {
              showStatus("起動します...");
              vueApp.playFile(target);
              overlay.style.display = 'none';
              unwatch(); // 監視解除
            }
          }, { deep: true });

          // Vueのインポートメソッドを直接叩く（確実）
          vueApp.uploadRom({ target: { files: [file] } });

        } catch (e) {
          // 【機能3】フォールバック：セキュリティ制限等で自動 fetch が弾かれた場合、手動で選ばせる
          showStatus("ローカル制限により自動取得できませんでした。お手持ちのマリオのROMファイルを選択してください。");
          startBtn.textContent = "ROMファイルを選択して起動";
          
          const uploadInput = document.getElementById('uploadRom');
          
          const onManualUpload = () => {
            startBtn.textContent = "Loading...";
            // 手動で選ばれたファイルがリストに入った瞬間を検知
            const unwatchManual = vueApp.$watch('files.list', (newList) => {
              if (newList && newList.length > 0) {
                showStatus("起動します...");
                vueApp.playFile(newList[newList.length - 1]);
                overlay.style.display = 'none';
                unwatchManual();
              }
            }, { deep: true });
            uploadInput.removeEventListener('change', onManualUpload);
          };

          uploadInput.addEventListener('change', onManualUpload);
          uploadInput.click(); // PC/スマホのファイル選択ダイアログを強制表示
        }
      });

      // --- 画面上のコントローラー入力をキーボード信号として全方位にブロードキャスト ---
      const triggerKey = (eventName, keyCode, legacyCode) => {
        const event = new KeyboardEvent(eventName, {
          code: keyCode,
          key: keyCode,
          bubbles: true,
          cancelable: true
        });

        // 古い判別式（keyCode, which）を使うエミュレータのためにプロパティを強制注入
        Object.defineProperty(event, 'keyCode', { get: () => parseInt(legacyCode) });
        Object.defineProperty(event, 'which', { get: () => parseInt(legacyCode) });

        window.dispatchEvent(event);
        document.dispatchEvent(event);
        
        const canvas = document.querySelector('canvas');
        if (canvas) canvas.dispatchEvent(event);
      };

      const buttons = document.querySelectorAll('[data-key]');
      
      buttons.forEach(btn => {
        const key = btn.getAttribute('data-key');
        const legacyCode = btn.getAttribute('data-keycode');

        // スマホ用タッチイベント
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          btn.classList.add('active');
          triggerKey('keydown', key, legacyCode);
        }, { passive: false });

        btn.addEventListener('touchend', (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          triggerKey('keyup', key, legacyCode);
        }, { passive: false });

        btn.addEventListener('touchcancel', (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          triggerKey('keyup', key, legacyCode);
        }, { passive: false });

        // PCテスト用マウスイベント
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          btn.classList.add('active');
          triggerKey('keydown', key, legacyCode);
        });

        btn.addEventListener('mouseup', (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          triggerKey('keyup', key, legacyCode);
        });

        btn.addEventListener('mouseleave', (e) => {
          if (btn.classList.contains('active')) {
            btn.classList.remove('active');
            triggerKey('keyup', key, legacyCode);
          }
        });
      });
    });
  </script>
</body>
</html>
