<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Super Mario - Web Emulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    /* ========== 基本リセット & スタイル ========== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #7b1022; /* ファミコンカラー（えんじ） */
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    *, *:before, *:after { box-sizing: inherit; }

    /* 全体コンテナ */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100dvw;
      position: relative;
    }

    /* ゲーム画面表示エリア */
    .screen-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100% !important;
      max-width: 480px !important;
      height: auto !important;
      aspect-ratio: 256 / 240;
      border: 4px solid #d4af37;
      border-radius: 8px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      z-index: 1;
    }

    /* バーチャルコントローラーベース */
    .controls {
      height: 220px;
      background-color: #e0d0a0; /* ゴールドベージュ */
      display: flex;
      position: relative;
      padding: 10px;
      border-top: 4px solid #000;
      z-index: 10;
    }

    /* 十字キー */
    .dpad {
      position: relative;
      width: 120px;
      height: 120px;
      margin-top: 25px;
      margin-left: 20px;
    }
    .dpad-btn {
      position: absolute;
      background-color: #333;
      border: 2px solid #111;
      border-radius: 4px;
      width: 38px;
      height: 38px;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
    }
    .dpad-btn.active { background-color: #777; }
    .dpad-up { top: 0; left: 41px; height: 46px; border-bottom: none; border-radius: 4px 4px 0 0; }
    .dpad-down { bottom: 0; left: 41px; height: 46px; border-top: none; border-radius: 0 0 4px 4px; }
    .dpad-left { top: 41px; left: 0; width: 46px; border-right: none; border-radius: 4px 0 0 4px; }
    .dpad-right { top: 41px; right: 0; width: 46px; border-left: none; border-radius: 0 4px 4px 0; }
    .dpad-center {
      position: absolute;
      top: 41px; left: 41px;
      width: 38px; height: 38px;
      background-color: #333;
    }

    /* SELECT / START */
    .center-btns {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }
    .pill-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pill-btn {
      width: 45px;
      height: 16px;
      background-color: #333;
      border-radius: 8px;
      border: 2px solid #111;
      box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
      transform: rotate(-20deg);
    }
    .pill-btn.active { background-color: #777; }
    .pill-label { font-size: 10px; color: #7b1022; font-weight: bold; margin-top: 10px; }

    /* A / B ボタン */
    .action-btns {
      position: absolute;
      right: 20px;
      top: 50px;
      display: flex;
      gap: 20px;
    }
    .round-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    .round-btn-wrap:last-child { margin-top: 0; }
    .round-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: #7b1022;
      border: 3px solid #333;
      box-shadow: inset -2px -2px 5px rgba(0,0,0,0.6), 2px 2px 4px rgba(0,0,0,0.3);
      -webkit-tap-highlight-color: transparent;
    }
    .round-btn.active { background-color: #d6304c; }
    .round-label { font-size: 14px; color: #7b1022; font-weight: bold; margin-top: 8px; }

    /* 初期ロード・ファイル選択用オーバーレイ */
    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #start-btn {
      padding: 18px 40px;
      font-size: 20px;
      background: #d4af37;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      -webkit-tap-highlight-color: transparent;
    }
    #status-log {
      margin-top: 25px;
      font-size: 14px;
      color: #ccc;
      text-align: center;
    }

    /* ===================================================
       【最強レスポンス】スマホ横画面（Landscape）時のUI
       =================================================== */
    @media (orientation: landscape) {
      .screen-container {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        padding: 0;
      }
      canvas {
        width: auto !important;
        max-width: none !important;
        height: 100% !important;
        max-height: 100dvh !important;
        border: none;
        border-radius: 0;
      }
      .controls {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: transparent !important;
        border-top: none !important;
        pointer-events: none; /* 背景のタッチを透過 */
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .dpad, .center-btns, .action-btns {
        pointer-events: auto; /* ボタン単体はタッチ可能にする */
      }
      .dpad {
        position: absolute;
        bottom: 25px; left: 30px;
        margin: 0;
        transform: scale(1.15);
      }
      .center-btns {
        position: absolute;
        bottom: 20px; left: 50%;
        transform: translateX(-50%) scale(0.9);
      }
      .pill-label { color: #fff; }
      .action-btns {
        position: absolute;
        bottom: 35px; right: 30px;
        top: auto;
        transform: scale(1.15);
      }
      .round-label { color: #fff; }
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h2 style="margin-bottom: 30px; letter-spacing: 3px;">SUPER MARIO BROS.</h2>
    <button id="start-btn">GAME START</button>
    <div id="status-log">ボタンを押してゲーム（.nes）ファイルを読み込んでください</div>
    <input type="file" id="file-input" accept=".nes" style="display: none;">
  </div>

  <div id="app-container">
    <div class="screen-container">
      <canvas id="emulator-canvas" width="256" height="240"></canvas>
    </div>

    <div class="controls">
      <div class="dpad">
        <div class="dpad-center"></div>
        <div class="dpad-btn dpad-up" data-key="ArrowUp" data-keycode="38"></div>
        <div class="dpad-btn dpad-down" data-key="ArrowDown" data-keycode="40"></div>
        <div class="dpad-btn dpad-left" data-key="ArrowLeft" data-keycode="37"></div>
        <div class="dpad-btn dpad-right" data-key="ArrowRight" data-keycode="39"></div>
      </div>

      <div class="center-btns">
        <div class="pill-btn-wrap">
          <div class="pill-btn" data-key="ShiftLeft" data-keycode="16"></div>
          <div class="pill-label">SELECT</div>
        </div>
        <div class="pill-btn-wrap">
          <div class="pill-btn" data-key="Enter" data-keycode="13"></div>
          <div class="pill-label">START</div>
        </div>
      </div>

      <div class="action-btns">
        <div class="round-btn-wrap">
          <div class="round-btn" data-key="KeyZ" data-keycode="90"></div>
          <div class="round-label">B</div>
        </div>
        <div class="round-btn-wrap">
          <div class="round-btn" data-key="KeyX" data-keycode="88"></div>
          <div class="round-label">A</div>
        </div>
      </div>
    </div>
  </div>

  <script src="idb.min.js"></script>
  <script src="sha1.js"></script>
  <script src="demo.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const startBtn = document.getElementById('start-btn');
      const fileInput = document.getElementById('file-input');
      const overlay = document.getElementById('start-overlay');
      const statusLog = document.getElementById('status-log');
      
      // クラス名マッピング（デモスクリプトの古いグローバル定義との互換性を確保）
      const canvasEl = document.getElementById('emulator-canvas');

      // 1. 起動処理：ユーザーのタップから即時にファイル選択を連動（Safari対策の最重要項目）
      startBtn.addEventListener('click', () => {
        statusLog.textContent = "ファイルを選択してください...";
        fileInput.click(); 
      });

      // 2. ファイルが選択されたら純粋なJS処理でエミュレータへ流し込む
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusLog.textContent = "ゲームを起動中...";

        // demo.js のコアエンジンにファイルを直で渡すための処理
        // 元の仕組み(IndexedDBへの保存と実行)をVueを介さず直接エミュレート
        const reader = new FileReader();
        reader.onload = async function(event) {
          try {
            const arrayBuffer = event.target.content || event.target.result;
            
            // demo.js内部に定義されている、またはグローバルで動く初期化関数を呼び出す
            // 通常、demo.jsがwindowオブジェクトや特定のロード処理を保持しているため、
            // ファイルの読み込み完了イベントを捏造または直接play処理に繋ぎます
            if (window.playNesBuffer) {
              window.playNesBuffer(arrayBuffer, file.name);
            } else if (window.Emu && window.Emu.start) {
              window.Emu.start(arrayBuffer);
            } else {
              // demo.jsの標準挙動へフォールバック（カスタムイベントで通知）
              const customEvent = new CustomEvent('romloaded', { detail: { buffer: arrayBuffer, name: file.name } });
              window.dispatchEvent(customEvent);
            }

            // ロード画面を消してゲーム開始
            overlay.style.display = 'none';
          } catch (err) {
            statusLog.textContent = "起動エラーが発生しました。ファイルを確認してください。";
            console.error(err);
          }
        };
        reader.readAsArrayBuffer(file);
      });

      // 3. 超高速・高精度なバーチャルコントローラーのキーエミュレーション
      const dispatchKey = (type, code, keyCode) => {
        const ev = new KeyboardEvent(type, {
          key: code,
          code: code,
          keyCode: parseInt(keyCode),
          which: parseInt(keyCode),
          bubbles: true,
          cancelable: true
        });
        
        // 旧仕様ブラウザ（Safari等）への互換ポリフィル
        Object.defineProperty(ev, 'keyCode', { get: () => parseInt(keyCode) });
        Object.defineProperty(ev, 'which', { get: () => parseInt(keyCode) });

        window.dispatchEvent(ev);
        document.dispatchEvent(ev);
        canvasEl.dispatchEvent(ev);
      };

      const bindButtons = document.querySelectorAll('[data-key]');
      bindButtons.forEach(btn => {
        const key = btn.getAttribute('data-key');
        const keyCode = btn.getAttribute('data-keycode');

        // iOS用の超感度タッチイベント
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          btn.classList.add('active');
          dispatchKey('keydown', key, keyCode);
        }, { passive: false });

        btn.addEventListener('touchend', (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          dispatchKey('keyup', key, keyCode);
        }, { passive: false });

        btn.addEventListener('touchcancel', (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          dispatchKey('keyup', key, keyCode);
        }, { passive: false });

        // PCテスト用のマウスイベント
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          btn.classList.add('active');
          dispatchKey('keydown', key, keyCode);
        });

        btn.addEventListener('mouseup', (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          dispatchKey('keyup', key, keyCode);
        });
      });
    });
  </script>
</body>
</html>
