<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Super Mario - Web Emulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    /* ========== 共通 ========== */
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ========== ゲーム画面 ========== */
    /* 画面いっぱいに置き、縦でも横でもアスペクト比を保ったまま最大表示する */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    /* width/height を 100% にして object-fit:contain でアスペクト比を保ったまま
       使える領域いっぱいまで拡大する。max-* だけだと 256x240 のまま小さく
       表示されてしまうので、ここが「画面が小さい」問題の修正点。 */
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      background-color: #000;
    }

    /* ========== バーチャルコントローラー（オーバーレイ） ========== */
    /* fixed配置で常に画面の隅に出すので、縦・横どちらの向きでも崩れない。
       safe-area-inset でiPhoneのノッチ／ホームバーを避ける。 */
    .ctrl {
      position: fixed;
      z-index: 50;
      display: flex;
      touch-action: none;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.85);
      font-weight: bold;
      background-color: rgba(40,40,40,0.55);
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: background-color .05s, transform .05s;
    }
    .btn.active { background-color: rgba(214,48,76,0.85); transform: scale(0.94); }

    /* 十字キー（左下） */
    #dpad {
      left: max(12px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: clamp(132px, 34vmin, 200px);
      height: clamp(132px, 34vmin, 200px);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
    }
    #dpad .btn {
      background-color: rgba(30,30,30,0.6);
      border-radius: 8px;
    }
    .d-up    { grid-area: 1 / 2 / 2 / 3; border-radius: 8px 8px 0 0 !important; }
    .d-left  { grid-area: 2 / 1 / 3 / 2; border-radius: 8px 0 0 8px !important; }
    .d-right { grid-area: 2 / 3 / 3 / 4; border-radius: 0 8px 8px 0 !important; }
    .d-down  { grid-area: 3 / 2 / 4 / 3; border-radius: 0 0 8px 8px !important; }
    .d-mid   { grid-area: 2 / 2 / 3 / 3; background-color: rgba(30,30,30,0.6); border: 2px solid rgba(255,255,255,0.15); }
    .d-up:after    { content: "▲"; font-size: 60%; }
    .d-down:after  { content: "▼"; font-size: 60%; }
    .d-left:after  { content: "◀"; font-size: 60%; }
    .d-right:after { content: "▶"; font-size: 60%; }

    /* A / B ボタン（右下） */
    #ab {
      right: max(12px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      align-items: flex-end;
      gap: clamp(14px, 4vmin, 28px);
    }
    #ab .btn {
      width: clamp(58px, 15vmin, 90px);
      height: clamp(58px, 15vmin, 90px);
      border-radius: 50%;
      font-size: clamp(18px, 5vmin, 28px);
      background-color: rgba(123,16,34,0.6);
    }
    #ab .btn-b { margin-bottom: clamp(28px, 8vmin, 52px); } /* Bを少し下げて指を置きやすく */

    /* START / SELECT（縦向き：上中央） */
    #se {
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      gap: 16px;
    }
    #se .btn {
      height: clamp(26px, 5vmin, 34px);
      padding: 0 14px;
      border-radius: 16px;
      font-size: clamp(10px, 2.4vmin, 13px);
      letter-spacing: 1px;
    }

    /* 横向きでは画面が左右に黒帯（レターボックス）を持つので、ゲーム画面と
       重ならないように START / SELECT を左の黒帯へ逃がす。
       v6では左帯の「中央」に置いていたが、左下の十字キーが画面の高さの
       半分近くを占めるため小さめのiPhone横画面では十字キーと重なっていた。
       そこで左帯の「上端」へ縦に並べて置き、下端の十字キーと完全に分離する。 */
    @media (orientation: landscape) {
      #se {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        transform: none;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }

    /* ========== タイトル兼ロード画面 ========== */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      text-align: center;
    }
    #overlay h2 { margin: 0 0 24px; letter-spacing: 2px; }
    #start-btn {
      padding: 15px 34px;
      font-size: 18px;
      background: #d4af37;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #kbguide { margin-top: 22px; font-size: 12px; color: #d4af37; max-width: 90%; line-height: 1.8; }
    #status { margin-top: 14px; font-size: 12px; color: #bbb; max-width: 80%; line-height: 1.5; }
  </style>
</head>
<body>

  <div id="stage">
    <canvas width="256" height="240"></canvas>
  </div>

  <!-- バーチャルコントローラー。data-input はキー入力インデックス
       0:UP 1:DOWN 2:LEFT 3:RIGHT 4:B 5:A 6:START 7:SELECT -->
  <div id="dpad" class="ctrl">
    <div class="btn d-up"    data-input="0"></div>
    <div class="btn d-left"  data-input="2"></div>
    <div class="d-mid"></div>
    <div class="btn d-right" data-input="3"></div>
    <div class="btn d-down"  data-input="1"></div>
  </div>

  <div id="ab" class="ctrl">
    <div class="btn btn-b" data-input="4">B</div>
    <div class="btn btn-a" data-input="5">A</div>
  </div>

  <div id="se" class="ctrl">
    <div class="btn" data-input="7">SELECT</div>
    <div class="btn" data-input="6">START</div>
  </div>

  <div id="overlay">
    <h2>SUPER MARIO BROS.</h2>
    <button id="start-btn">GAME START</button>
    <div id="kbguide">
      PCキー操作：&nbsp; ↑↓←→＝移動 &nbsp;/&nbsp; Z＝B(ダッシュ・ファイア) &nbsp;/&nbsp; X＝A(ジャンプ) &nbsp;/&nbsp; Enter＝START &nbsp;/&nbsp; Shift＝SELECT<br>
      ※ゲーム開始は <b>Enter</b>（START）を押してください<br>
      ※iPhoneは本体横の<b>消音(マナー)スイッチ</b>がオンだと音が出ません
    </div>
    <div id="status">タップ／クリックして起動します</div>
  </div>

  <!-- worker.js / audioWorklet.js は使わず、エミュレータ本体(binjnes)を
       メインスレッドで直接動かす。音もメインスレッドで
       AudioBufferSourceNode をつないで鳴らすため、スマホ(iOS Safari含む)でも
       安定して音が出る。 -->
  <script src="binjnes-simd.js"></script>
  <script>
  "use strict";
  (function () {
    const SCREEN_WIDTH = 256;
    const SCREEN_HEIGHT = 240;
    const AUDIO_FRAMES = 4096;
    const ROM_URL = "./super_mario.nes";

    // binjnes イベントフラグ（worker.js と同じ定義）
    const EVENT_NEW_FRAME = 1;
    const EVENT_AUDIO_BUFFER_FULL = 2;
    const EVENT_UNTIL_TICKS = 4;
    const MAX_UPDATE_SEC = 5 / 60;

    const canvasEl = document.querySelector("canvas");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start-btn");
    const statusEl = document.getElementById("status");

    let emulator = null;
    let audioCtx = null;

    const setStatus = (msg) => { statusEl.textContent = msg; };

    /* ---------- iOS音声アンロック ----------
       iPhone(iOS Safari)で音が出ない問題への対策をまとめたヘルパー。
       原因は主に次の2つ:
         (1) AudioContext がユーザー操作直後でないと suspended のままになる。
             → 起動のタップ内で resume() し、無音バッファを1発鳴らして起こす。
             → さらにタップ/復帰のたびに running か確認して resume() し直す。
         (2) iOSはWeb Audioを「着信音(ringer)」チャンネルで鳴らすため、
             本体横の消音スイッチがオンだと無音になる。
             → 無音の <audio> 要素をループ再生してオーディオセッションを
               「メディア再生」チャンネルへ切り替え、消音スイッチの影響を
               受けにくくする（unmute トリック）。 */
    let silentEl = null;

    // 0.5秒の無音WAV(8bit/8kHz mono)をその場で生成して Blob URL を返す
    const buildSilentWavUrl = () => {
      const rate = 8000, n = rate / 2;       // 0.5秒
      const buf = new ArrayBuffer(44 + n);
      const dv = new DataView(buf);
      const wr = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
      wr(0, "RIFF"); dv.setUint32(4, 36 + n, true); wr(8, "WAVE");
      wr(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, rate, true); dv.setUint32(28, rate, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
      wr(36, "data"); dv.setUint32(40, n, true);
      for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128); // 8bit PCM の無音は 128
      return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
    };

    const startSilentLoop = () => {
      if (silentEl) { silentEl.play().catch(() => {}); return; }
      const el = document.createElement("audio");
      el.loop = true;
      el.preload = "auto";
      el.setAttribute("playsinline", "");      // iOSでフルスクリーン化させない
      el.muted = false;                        // muted だとセッション切替が効かないので鳴らす(無音)
      el.volume = 1.0;
      el.src = buildSilentWavUrl();
      el.play().catch(() => {});
      silentEl = el;
    };

    // suspended になっていたら resume + 無音バッファで起こす（ユーザー操作内で呼ぶ）
    const unlockAudio = () => {
      if (!audioCtx) return;
      if (audioCtx.state !== "running") audioCtx.resume().catch(() => {});
      try {
        const b = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
        const s = audioCtx.createBufferSource();
        s.buffer = b;
        s.connect(audioCtx.destination);
        s.start(0);
      } catch (_) {}
      startSilentLoop();
    };

    // タップ・クリック・タブ復帰のたびに念のため起こし直す
    document.addEventListener("touchend", unlockAudio, true);
    document.addEventListener("click", unlockAudio, true);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") unlockAudio();
    });

    /* ---------- 映像（WebGL2、demo.js の WebGLRenderer を流用） ---------- */
    class WebGLRenderer {
      constructor(el) {
        const gl = this.gl = el.getContext("webgl2", { preserveDrawingBuffer: true });
        if (gl === null) throw new Error("unable to create webgl context");

        const w = SCREEN_WIDTH / 256;
        const h = SCREEN_HEIGHT / 256;
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
          -1, -1, 0, h,
          +1, -1, w, h,
          -1, +1, 0, 0,
          +1, +1, w, 0,
        ]), gl.STATIC_DRAW);

        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16UI, 256, 256, 0, gl.RED_INTEGER, gl.UNSIGNED_SHORT, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);

        const compileShader = (type, source) => {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            throw new Error(`compileShader failed: ${gl.getShaderInfoLog(shader)}`);
          return shader;
        };

        const vertexShader = compileShader(gl.VERTEX_SHADER,
          `#version 300 es
           in vec2 aPos; in vec2 aTexCoord; out vec2 vTexCoord;
           void main(void) { gl_Position = vec4(aPos, 0.0, 1.0); vTexCoord = aTexCoord; }`);
        const fragmentShader = compileShader(gl.FRAGMENT_SHADER,
          `#version 300 es
           precision highp float;
           in vec2 vTexCoord; out vec4 outColor;
           uniform highp usampler2D uSampler;
           uniform uint uPalette[512];
           void main(void) {
             uint color = uPalette[texture(uSampler, vTexCoord).r & 511u];
             outColor = vec4(
               float((color >> 0) & 0xffu) / 255.5f,
               float((color >> 8) & 0xffu) / 255.5f,
               float((color >> 16) & 0xffu) / 255.5f,
               1.0f);
           }`);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS))
          throw new Error(`program link failed: ${gl.getProgramInfoLog(program)}`);
        gl.useProgram(program);

        const aPos = gl.getAttribLocation(program, "aPos");
        const aTexCoord = gl.getAttribLocation(program, "aTexCoord");
        const uPalette = gl.getUniformLocation(program, "uPalette");
        const uSampler = gl.getUniformLocation(program, "uSampler");

        gl.enableVertexAttribArray(aPos);
        gl.enableVertexAttribArray(aTexCoord);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, gl.FALSE, 16, 0);
        gl.vertexAttribPointer(aTexCoord, 2, gl.FLOAT, gl.FALSE, 16, 8);
        gl.uniform1i(uSampler, 0);
        gl.uniform1uiv(uPalette, new Uint32Array(512));
        this.uPalette = uPalette;
      }
      setPalette(palette) { this.gl.uniform1uiv(this.uPalette, palette); }
      renderTexture() {
        this.gl.clearColor(0.5, 0.5, 0.5, 1.0);
        this.gl.clear(this.gl.COLOR_BUFFER_BIT);
        this.gl.drawArrays(this.gl.TRIANGLE_STRIP, 0, 4);
      }
      uploadTexture(buffer) {
        this.gl.texSubImage2D(this.gl.TEXTURE_2D, 0, 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT,
          this.gl.RED_INTEGER, this.gl.UNSIGNED_SHORT, buffer);
      }
    }

    /* ---------- 音声（メインスレッドでスケジュール再生） ----------
       エミュレータが吐く Float32 のサンプル列を、AudioBuffer に詰めて
       currentTime を起点に隙間なく並べて再生する。Worklet/Worker を介さず
       メインスレッドだけで完結するので iOS Safari でも音が鳴る。 */
    class GameAudio {
      constructor(ctx) {
        this.ctx = ctx;
        this.gainNode = ctx.createGain();
        this.gainNode.connect(ctx.destination);
        this.gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
        this.playTime = 0;
        // 出だしの途切れを防ぐためのわずかな先読み（秒）
        this.lead = 0.10;
      }
      queue(samples) {
        const ctx = this.ctx;
        // iOSではタブ復帰直後などに suspended へ落ちることがあるので鳴らす前に確認
        if (ctx.state !== "running") ctx.resume().catch(() => {});
        const buf = ctx.createBuffer(1, samples.length, ctx.sampleRate);
        buf.getChannelData(0).set(samples);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(this.gainNode);

        const now = ctx.currentTime;
        // 再生位置が現在時刻に追いつかれた（アンダーラン）ら先読みを足して立て直す
        if (this.playTime < now + 0.005) {
          this.playTime = now + this.lead;
        }
        src.start(this.playTime);
        this.playTime += buf.duration;
      }
    }

    /* ---------- エミュレータ（メインスレッドで実行） ---------- */
    class Emulator {
      constructor(module, romBuffer, ctx) {
        this.module = module;
        this.audio = new GameAudio(ctx);
        this.renderer = new WebGLRenderer(canvasEl);

        // ROM を 32K 境界に切り上げて WASM ヒープへ転送
        const size = (romBuffer.byteLength + 0x7fff) & ~0x7fff;
        this.romDataPtr = module._malloc(size);
        new Uint8Array(module.HEAP8.buffer, this.romDataPtr, size)
          .fill(0)
          .set(new Uint8Array(romBuffer));
        this.e = module._emulator_new_simple(
          this.romDataPtr, size, ctx.sampleRate, AUDIO_FRAMES);
        if (this.e === 0) throw new Error("Invalid ROM.");

        // ジョイパッドをエミュレータに接続する。これを呼ばないと _set_joyp_* が
        // 無視され、キーボード／画面ボタンの入力がまったく効かない（重要）。
        this.joypadPtr = module._joypad_new_simple(this.e);

        this.videoBuffer = new Uint16Array(
          module.HEAP16.buffer,
          module._get_frame_buffer_ptr(this.e),
          module._get_frame_buffer_size(this.e) >> 1);
        this.audioBuffer = new Float32Array(
          module.HEAP8.buffer,
          module._get_audio_buffer_ptr(this.e),
          module._get_audio_buffer_capacity(this.e));
        const palette = new Uint32Array(
          module.HEAP32.buffer,
          module._get_palette_ptr(this.e),
          module._get_palette_size(this.e) >> 2);
        this.renderer.setPalette(palette);

        // キー入力。順番は data-input のインデックスと一致
        // 0:UP 1:DOWN 2:LEFT 3:RIGHT 4:B 5:A 6:START 7:SELECT（プレイヤー0）
        this.keyFuncs = [
          module._set_joyp_up.bind(null, this.e, 0),
          module._set_joyp_down.bind(null, this.e, 0),
          module._set_joyp_left.bind(null, this.e, 0),
          module._set_joyp_right.bind(null, this.e, 0),
          module._set_joyp_B.bind(null, this.e, 0),
          module._set_joyp_A.bind(null, this.e, 0),
          module._set_joyp_start.bind(null, this.e, 0),
          module._set_joyp_select.bind(null, this.e, 0),
        ];
        module._set_controller_type(this.e, 0, 0); // CONTROLLER_JOYPAD
        module._set_controller_type(this.e, 1, 0);

        this.rafCancelToken = null;
        this.lastRafSec = 0;
        this.leftoverSecs = 0;
      }

      get secs() { return this.module._emulator_get_secs(this.e); }

      runUntil(runUntilSecs) {
        while (true) {
          const event = this.module._emulator_run_until_secs(this.e, runUntilSecs);
          if (event & EVENT_NEW_FRAME) {
            this.renderer.uploadTexture(this.videoBuffer);
            this.renderer.renderTexture();
          }
          if (event & EVENT_AUDIO_BUFFER_FULL) {
            // subarray のビューを渡す（createBuffer 内で set によりコピーされる）
            this.audio.queue(this.audioBuffer.subarray(0, AUDIO_FRAMES));
          }
          if (event & EVENT_UNTIL_TICKS) break;
        }
        this.leftoverSecs = (this.secs - runUntilSecs) | 0;
      }

      rafCallback(rafStartMs) {
        this.requestAnimationFrame();
        const startSec = rafStartMs / 1000;
        const deltaSec = Math.max(startSec - (this.lastRafSec || startSec), 0);
        this.lastRafSec = startSec;
        const deltaSecs = Math.min(deltaSec, MAX_UPDATE_SEC);
        const runUntilSecs = this.secs + deltaSecs - this.leftoverSecs;
        this.runUntil(runUntilSecs);
      }

      requestAnimationFrame() {
        this.rafCancelToken = requestAnimationFrame(this.rafCallback.bind(this));
      }

      inputKey(index, isKeyDown) { this.keyFuncs[index](isKeyDown); }
    }

    /* ---------- 入力 ---------- */
    const sendKey = (index, keyDown) => {
      if (!emulator) return;
      emulator.inputKey(index, keyDown);
    };

    /* キーボード操作（PC用）
       0:UP 1:DOWN 2:LEFT 3:RIGHT 4:B 5:A 6:START 7:SELECT */
    const KEYMAP = {
      ArrowUp: 0, ArrowDown: 1, ArrowLeft: 2, ArrowRight: 3,
      KeyW: 0, KeyS: 1, KeyA: 2, KeyD: 3,
      KeyZ: 4, KeyX: 5,           // B / A
      KeyK: 4, KeyL: 5,           // B / A（予備）
      Enter: 6, Space: 6,         // START
      ShiftLeft: 7, ShiftRight: 7, Tab: 7, // SELECT
    };
    const heldKeys = Object.create(null);

    window.addEventListener("keydown", (e) => {
      const index = KEYMAP[e.code];
      if (index === undefined) return;
      e.preventDefault();
      if (heldKeys[e.code]) return; // オートリピート抑止
      heldKeys[e.code] = true;
      sendKey(index, true);
    });
    window.addEventListener("keyup", (e) => {
      const index = KEYMAP[e.code];
      if (index === undefined) return;
      e.preventDefault();
      heldKeys[e.code] = false;
      sendKey(index, false);
    });

    /* タッチ操作（スマホ用）。各ボタンが個別要素なので複数同時押し可。 */
    document.querySelectorAll("[data-input]").forEach((btn) => {
      const index = parseInt(btn.getAttribute("data-input"), 10);
      const press = (e) => { e.preventDefault(); btn.classList.add("active"); sendKey(index, true); };
      const release = (e) => { e.preventDefault(); btn.classList.remove("active"); sendKey(index, false); };

      btn.addEventListener("touchstart", press, { passive: false });
      btn.addEventListener("touchend", release, { passive: false });
      btn.addEventListener("touchcancel", release, { passive: false });
      // PCでのマウス確認用
      btn.addEventListener("mousedown", press);
      btn.addEventListener("mouseup", release);
      btn.addEventListener("mouseleave", (e) => {
        if (btn.classList.contains("active")) release(e);
      });
    });

    /* ---------- 起動（ユーザー操作内で AudioContext を有効化） ---------- */
    startBtn.addEventListener("click", async () => {
      try {
        startBtn.disabled = true;
        setStatus("起動中...");

        if (typeof BinjnesSimd !== "function") {
          throw new Error("エミュレータの読み込みに失敗しました（SIMD未対応の可能性）");
        }

        // AudioContext はユーザー操作の中で生成・resume する（iOS必須）。
        // 生成直後に無音バッファ＋無音ループで「起こして」おくことで、
        // この後の重いWASMコンパイル中にiOSがコンテキストを寝かせても
        // ゲーム開始時に確実に音が鳴るようにする。
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        await audioCtx.resume();
        unlockAudio();

        setStatus("エミュレータを初期化中...");
        const module = await BinjnesSimd();

        setStatus("ROMを読み込み中...");
        const resp = await fetch(ROM_URL);
        if (!resp.ok) throw new Error(`ROM取得失敗: ${resp.status}`);
        const romBuffer = await resp.arrayBuffer();

        // 念のためゲーム開始の直前にもう一度起こす（長いロードで寝た場合に備える）
        await audioCtx.resume();
        unlockAudio();

        emulator = new Emulator(module, romBuffer, audioCtx);
        emulator.requestAnimationFrame();
        overlay.style.display = "none";
        // キーボード入力が確実に届くようウィンドウへフォーカスを戻す
        // （GAME START ボタンにフォーカスが残ると一部環境でキーを取りこぼすため）
        try { startBtn.blur(); window.focus(); } catch (_) {}
      } catch (err) {
        startBtn.disabled = false;
        setStatus("エラー: " + (err && err.message ? err.message : err));
        console.error(err);
      }
    });
  })();
  </script>
</body>
</html>
