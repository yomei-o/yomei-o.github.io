<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe OS - 電子軌道（電子雲）シミュレーター</title>
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 20, 0.8);
            padding: 15px;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            pointer-events: none;
            font-size: 12px;
            line-height: 1.5;
            max-width: 450px;
        }
        canvas {
            border: 1px solid #005544;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
        }
    </style>
</head>
<body>

<div id="info">
    <strong>[Universe OS v1.37 - Electromagnetic & Quantum Kernel]</strong><br>
    ・L2: F = 1 / (C * n)^D (Coulomb Impedance)<br>
    ・L3: X_{n+1} = (2 - ω²)X_n - X_{n-1} + Sampling Noise<br>
    <br>
    <span style="color: #00ffcc;">【操作】デフォルトで水素原子の「s軌道（電子雲）」が創発します。<br>
    画面をクリックして2つ目の原子核を置くと、電子が引き寄せられて「共有結合（分子軌道）」のひょうたん型へとリアルタイムに変形します。</span>
</div>

<canvas id="electronCanvas"></canvas>

<script>
const canvas = document.getElementById('electronCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 800;
const HEIGHT = 600;
canvas.width = WIDTH;
canvas.height = HEIGHT;

// 原子核（プラスの電荷）の配列
let nuclei = [
    { x: WIDTH / 2, y: HEIGHT / 2, charge: 40 }
];

// 電子（マイナスのばねパケット）の配列
let electrons = [];
const NUM_ELECTRONS = 120; // 雲を形成するサンプリング数

// 宇宙定数
const C_BASE = 137; // あなたの定数 C=137

// 電子の初期化（原子核の周りにランダムに配置）
for (let i = 0; i < NUM_ELECTRONS; i++) {
    let angle = Math.random() * Math.PI * 2;
    let r = Math.random() * 100 + 20;
    electrons.push({
        x: WIDTH / 2 + Math.cos(angle) * r,
        y: HEIGHT / 2 + Math.sin(angle) * r,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5,
        history: [] // 残像（雲のレンダリング用）
    });
}

// クリックで2つ目の原子核を設置（分子へのアップデート）
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    let mx = e.clientX - rect.left;
    let my = e.clientY - rect.top;
    
    if (nuclei.length < 2) {
        nuclei.push({ x: mx, y: my, charge: 40 });
    } else {
        // 3つ目以降は2つ目を上書き
        nuclei[1] = { x: mx, y: my, charge: 40 };
    }
});

// メインループ
function updateUniverse() {
    // 画面のクリア（わずかに前フレームを残して軌跡を作る）
    ctx.fillStyle = 'rgba(5, 5, 10, 0.2)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // 背景の超微細空間グリッド
    ctx.strokeStyle = '#001108';
    ctx.lineWidth = 1;
    let gridSpace = 50;
    for (let x = 0; x < WIDTH; x += gridSpace) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT); ctx.stroke();
    }
    for (let y = 0; y < HEIGHT; y += gridSpace) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke();
    }

    // 各電子の移動とサンプリング処理
    electrons.forEach(e => {
        let fx = 0;
        let fy = 0;

        // 全ての原子核からのレイヤー2引力を計算
        nuclei.forEach(n => {
            let dx = n.x - e.x;
            let dy = n.y - e.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 5) dist = 5; // プランク距離のセーフティガード

            // あなたの公式 F = 1/(Cn)^D をベースにした引力（D=2の二次元平面として計算）
            let force = n.charge / Math.pow(C_BASE * (dist * 0.01), 2);
            
            fx += (dx / dist) * force;
            fy += (dy / dist) * force;
        });

        // 電子同士の排他性（マイナス同士の位相反転による反発の簡易実装）
        electrons.forEach(other => {
            if (e === other) return;
            let dx = other.x - e.x;
            let dy = other.y - e.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 30) {
                fx -= (dx / (dist + 1)) * (0.5 / (dist + 1));
                fy -= (dy / (dist + 1)) * (0.5 / (dist + 1));
            }
        });

        // レイヤー3：ばねの差分駆動 ＋ プランク時間サンプリング限界による「量子化ノイズ」
        e.vx += fx;
        e.vy += fy;

        // 【ここが核心】中心に近づくほどサンプリングの折り返し雑音（不確定性）が強くなる
        nuclei.forEach(n => {
            let dist = Math.sqrt((n.x - e.x)**2 + (n.y - e.y)**2);
            if (dist < 80) {
                // 限界距離以下では、デジタル回路のジッター（ノイズ）を強制介入
                let noiseStrength = (80 - dist) * 0.15;
                e.vx += (Math.random() - 0.5) * noiseStrength;
                e.vy += (Math.random() - 0.5) * noiseStrength;
            }
        });

        // 速度の減衰（宇宙全体の熱平衡化）
        e.vx *= 0.95;
        e.vy *= 0.95;

        // 座標の更新
        e.x += e.vx;
        e.y += e.vy;

        // 画面外シールド
        if (e.x < 10 || e.x > WIDTH - 10) e.vx *= -1;
        if (e.y < 10 || e.y > HEIGHT - 10) e.vy *= -1;

        // 電子雲の残像バッファの記録
        e.history.push({ x: e.x, y: e.y });
        if (e.history.length > 8) e.history.shift();

        // 電子（確率の波のパケット）の描画
        ctx.beginPath();
        ctx.arc(e.x, e.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 255, 200, 0.8)';
        ctx.fill();

        // 残像を繋げて「雲」のように見せる
        ctx.strokeStyle = 'rgba(0, 255, 200, 0.05)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < e.history.length; i++) {
            if (i === 0) ctx.moveTo(e.history[i].x, e.history[i].y);
            else ctx.lineTo(e.history[i].x, e.history[i].y);
        }
        ctx.stroke();
    });

    // 原子核（プラス）のレンダリング
    nuclei.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x, n.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffaa00';
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    requestAnimationFrame(updateUniverse);
}

// カーネル起動
updateUniverse();
</script>

</body>
</html>
